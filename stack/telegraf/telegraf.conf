# Telegraf: MQTT (Mosquitto) → InfluxDB, para los paneles de Grafana
[agent]
  interval = "5s"
  flush_interval = "5s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["campus/iot/+/+/telemetry"]
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASS}"
  client_id = "telegraf-campus"
  qos = 0
  name_override = "telemetria"
  data_format = "json"
  tag_keys = ["node", "building", "src"]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "umg"
  bucket = "campus"
